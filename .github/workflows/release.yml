name: Publicar release v0.1.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar versión y paquete
        run: |
          python3 -c 'import json; assert json.load(open("project.json"))["version"] == "0.1.0"'
          python3 scripts/build.py --check
          python3 scripts/validate.py
          python3 -m unittest discover -s tests
          git diff --check
      - name: Preparar descargas
        run: |
          python3 scripts/build.py --check --package
          cp adapters/le-chat/SKILL.md .artifacts/auditor-filosofico-le-chat-SKILL.md
          cp adapters/perplexity/SKILL.md .artifacts/auditor-filosofico-perplexity-SKILL.md
      - name: Calcular sumas de comprobación
        working-directory: .artifacts
        run: sha256sum *.zip *-SKILL.md > SHA256SUMS
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create v0.1.0 \
            --target "$RELEASE_COMMIT" \
            --title "Auditor Filosófico v0.1.0" \
            --notes-file docs/releases/v0.1.0.md \
            .artifacts/*.zip .artifacts/*-SKILL.md .artifacts/SHA256SUMS
